# VPS: copy .env.example → .env in the same directory as this file, then:
#   docker compose up -d --build

services:
  dealer-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL_FOR_CLIENT_REQUESTS: ${NEXT_PUBLIC_BACKEND_URL_FOR_CLIENT_REQUESTS}
        NEXT_PUBLIC_BACKEND_URL_FOR_SERVER_REQUESTS: ${NEXT_PUBLIC_BACKEND_URL_FOR_SERVER_REQUESTS}
    image: dealer-dashboard:latest
    container_name: dealer-dashboard
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_BACKEND_URL_FOR_CLIENT_REQUESTS: ${NEXT_PUBLIC_BACKEND_URL_FOR_CLIENT_REQUESTS}
      NEXT_PUBLIC_BACKEND_URL_FOR_SERVER_REQUESTS: ${NEXT_PUBLIC_BACKEND_URL_FOR_SERVER_REQUESTS}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
